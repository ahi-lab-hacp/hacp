name: Protocol change
description: Propose a change to HACP semantics or wire representation
title: "protocol: "
labels: [protocol]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What interoperability, safety, or implementation problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
